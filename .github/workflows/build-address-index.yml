name: build-address-index

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - geofabrik: baden-wuerttemberg
            output: baden-wuerttemberg
          - geofabrik: bayern
            output: bayern
          - geofabrik: brandenburg
            output: berlin_brandenburg
          - geofabrik: hamburg
            output: hamburg
          - geofabrik: hessen
            output: hessen
          - geofabrik: mecklenburg-vorpommern
            output: mecklenburg-vorpommern
          - geofabrik: niedersachsen
            output: niedersachsen_bremen
          - geofabrik: nordrhein-westfalen
            output: nordrhein-westfalen
          - geofabrik: rheinland-pfalz
            output: rheinland-pfalz
          - geofabrik: saarland
            output: saarland
          - geofabrik: sachsen-anhalt
            output: sachsen-anhalt
          - geofabrik: sachsen
            output: sachsen
          - geofabrik: schleswig-holstein
            output: schleswig-holstein
          - geofabrik: thueringen
            output: thueringen

    steps:
      - name: osmium installieren
        run: sudo apt-get update && sudo apt-get install -y osmium-tool sqlite3

      - name: ${{ matrix.geofabrik }}-Extrakt laden
        run: curl -L -o region.osm.pbf https://download.geofabrik.de/europe/germany/${{ matrix.geofabrik }}-latest.osm.pbf

      - name: Download prüfen
        run: |
          ls -lh region.osm.pbf
          file region.osm.pbf

      - name: Adressierbare Objekte extrahieren (GeoJSON, zeilenweise)
        run: |
          osmium tags-filter region.osm.pbf \
            w/highway w/addr:housenumber n/place \
            -o gefiltert.osm.pbf
          osmium export gefiltert.osm.pbf -f geojsonseq -o adressen.geojsonseq

      - name: SQLite-Datenbank mit FTS5 bauen
        run: |
          python3 -c "
          import json, sqlite3

          def get_point(geom):
              t = geom['type']
              coords = geom['coordinates']
              if t == 'Point':
                  return coords
              if t == 'LineString':
                  return coords[len(coords)//2]
              if t == 'Polygon':
                  ring = coords[0]
                  lon = sum(p[0] for p in ring) / len(ring)
                  lat = sum(p[1] for p in ring) / len(ring)
                  return [lon, lat]
              return None

          db = sqlite3.connect('adressen.sqlite')
          db.execute('CREATE VIRTUAL TABLE adressen USING fts5(name, typ, lat, lon)')

          with open('adressen.geojsonseq') as f:
              for zeile in f:
                  zeile = zeile.strip().lstrip(chr(30))
                  if not zeile:
                      continue
                  feature = json.loads(zeile)
                  props = feature.get('properties', {})
                  name = props.get('name') or props.get('addr:street')
                  if not name:
                      continue
                  punkt = get_point(feature['geometry'])
                  if punkt is None:
                      continue
                  lon, lat = punkt
                  db.execute('INSERT INTO adressen VALUES (?,?,?,?)', (name, props.get('highway') or props.get('place'), lat, lon))

          db.commit()
          "

      - name: Datenbank als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: adressen.sqlite
