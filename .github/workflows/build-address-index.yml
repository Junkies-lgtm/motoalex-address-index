name: build-address-index

on:
  workflow_dispatch:   # manueller Start-Button im Actions-Tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: osmium installieren
        run: sudo apt-get update && sudo apt-get install -y osmium-tool sqlite3

      - name: Brandenburg-Extrakt laden
        run: curl -L -o brandenburg.osm.pbf https://download.geofabrik.de/europe/germany/brandenburg-latest.osm.pbf

      - name: Download prüfen
        run: |
          ls -lh brandenburg.osm.pbf
          file brandenburg.osm.pbf

      - name: Adressierbare Objekte extrahieren (GeoJSON)
        run: |
          osmium tags-filter brandenburg.osm.pbf \
            w/highway w/addr:housenumber n/place \
            -o gefiltert.osm.pbf
          osmium export gefiltert.osm.pbf -o adressen.geojson

      - name: SQLite-Datenbank mit FTS5 bauen
        run: |
          python3 -c "
          import json, sqlite3

          def get_point(geom):
              t = geom['type']
              coords = geom['coordinates']
              if t == 'Point':
                  return coords
              if t == 'LineString':
                  return coords[len(coords)//2]
              if t == 'Polygon':
                  ring = coords[0]
                  lon = sum(p[0] for p in ring) / len(ring)
                  lat = sum(p[1] for p in ring) / len(ring)
                  return [lon, lat]
              return None

          db = sqlite3.connect('adressen.sqlite')
          db.execute('CREATE VIRTUAL TABLE adressen USING fts5(name, typ, lat, lon)')
          with open('adressen.geojson') as f:
              daten = json.load(f)
          for feature in daten['features']:
              props = feature['properties']
              name = props.get('name') or props.get('addr:street')
              if not name:
                  continue
              punkt = get_point(feature['geometry'])
              if punkt is None:
                  continue
              lon, lat = punkt
              db.execute('INSERT INTO adressen VALUES (?,?,?,?)', (name, props.get('highway') or props.get('place'), lat, lon))
          db.commit()
          "

      - name: Datenbank als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: adressen-brandenburg
          path: adressen.sqlite
