name: build-address-index

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'   # jeden 1. des Monats, 03:00 UTC

permissions:
  contents: write   # noetig, damit der Workflow Release-Assets hochladen darf

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Release anlegen oder aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-address-index
          name: Adressdatenbanken (aktuell)
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - geofabrik: baden-wuerttemberg
            output: baden-wuerttemberg
          - geofabrik: bayern
            output: bayern
          - geofabrik: brandenburg
            output: berlin_brandenburg
          - geofabrik: hamburg
            output: hamburg
          - geofabrik: hessen
            output: hessen
          - geofabrik: mecklenburg-vorpommern
            output: mecklenburg-vorpommern
          - geofabrik: niedersachsen
            output: niedersachsen_bremen
          - geofabrik: nordrhein-westfalen
            output: nordrhein-westfalen
          - geofabrik: rheinland-pfalz
            output: rheinland-pfalz
          - geofabrik: saarland
            output: saarland
          - geofabrik: sachsen-anhalt
            output: sachsen-anhalt
          - geofabrik: sachsen
            output: sachsen
          - geofabrik: schleswig-holstein
            output: schleswig-holstein
          - geofabrik: thueringen
            output: thueringen

    steps:
      - name: osmium installieren
        run: sudo apt-get update && sudo apt-get install -y osmium-tool sqlite3

      - name: ${{ matrix.geofabrik }}-Extrakt laden
        run: curl -L -o region.osm.pbf https://download.geofabrik.de/europe/germany/${{ matrix.geofabrik }}-latest.osm.pbf

      - name: Download pruefen
        run: |
          ls -lh region.osm.pbf
          file region.osm.pbf

      - name: Adressierbare Objekte extrahieren (GeoJSON, zeilenweise)
        run: |
          osmium tags-filter region.osm.pbf \
            w/highway w/addr:housenumber n/place \
            -o gefiltert.osm.pbf
          osmium export gefiltert.osm.pbf -f geojsonseq -o adressen.geojsonseq

      - name: SQLite-Datenbank mit FTS4 bauen
        run: |
          python3 -c "
          import json, sqlite3

          def get_point(geom):
              t = geom['type']
              coords = geom['coordinates']
              if t == 'Point':
                  return coords
              if t == 'LineString':
                  return coords[len(coords)//2]
              if t == 'Polygon':
                  ring = coords[0]
                  lon = sum(p[0] for p in ring) / len(ring)
                  lat = sum(p[1] for p in ring) / len(ring)
                  return [lon, lat]
              return None

          db = sqlite3.connect('adressen.sqlite')
          db.execute('CREATE VIRTUAL TABLE adressen USING fts4(strasse, hausnummer, ort, plz, lat, lon)')

          with open('adressen.geojsonseq') as f:
              for zeile in f:
                  zeile = zeile.strip().lstrip(chr(30))
                  if not zeile:
                      continue
                  feature = json.loads(zeile)
                  props = feature.get('properties', {})

                  strasse = props.get('addr:street')
                  ort = props.get('addr:city')
                  hausnummer = props.get('addr:housenumber', '')
                  plz = props.get('addr:postcode', '')

                  # Objekte ohne Strasse+Ort ueberspringen - ohne beides ist der Datensatz fuer die zweistufige Suche nutzlos
                  if not strasse or not ort:
                      continue

                  punkt = get_point(feature['geometry'])
                  if punkt is None:
                      continue
                  lon, lat = punkt

                  db.execute(
                      'INSERT INTO adressen VALUES (?,?,?,?,?,?)',
                      (strasse, hausnummer, ort, plz, lat, lon)
                  )

          db.commit()
          "

      - name: Datenbank umbenennen
        run: cp adressen.sqlite ${{ matrix.output }}.sqlite

      - name: Als Release-Asset hochladen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-address-index
          files: ${{ matrix.output }}.sqlite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
